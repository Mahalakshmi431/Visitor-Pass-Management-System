[build]
  command = "npm run build"
  publish = "client/dist"

[functions]
  directory = "netlify/functions"

# Send all API calls to the serverless-http function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback: serve index.html for client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
